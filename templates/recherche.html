<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche - GameFinder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="/" class="nav-brand">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                    <path d="M2 17L12 22L22 17"/>
                    <path d="M2 12L12 17L22 12"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <span class="brand-name">Game<span>Finder</span></span>
            </a>
            <div class="nav-links">
                <a href="/">Accueil</a>
                <a href="/recherche" class="active">Rechercher</a>
            </div>
            <a href="/" class="btn-nav-secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M5 12L12 19M5 12L12 5"/>
                </svg>
                <span>Retour</span>
            </a>
        </div>
    </nav>

    <!-- Search Section -->
    <section class="search-section">
        <div class="container">
            <div class="search-header">
                <div class="search-header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21L16.65 16.65"/>
                    </svg>
                </div>
                <h1>Rechercher un jeu</h1>
                <p>Trouvez le meilleur prix en quelques secondes</p>
            </div>

            <!-- Barre de recherche -->
            <form id="searchForm" class="search-form">
                <div class="search-wrapper">
                    <div class="search-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21L16.65 16.65"/>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="produit" 
                        placeholder="Ex: Galaxy Defenders, Mario, Zelda..." 
                        required
                        autocomplete="off"
                    >
                    <button type="submit" class="search-btn">
                        <span>Rechercher</span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12H19M19 12L12 5M19 12L12 19"/>
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Suggestions -->
            <div class="suggestions">
                <span class="suggestions-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"/>
                    </svg>
                    Populaires :
                </span>
                <button class="suggestion-chip" data-game="Galaxy Defenders">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="6" width="20" height="12" rx="2"/>
                        <path d="M6 12H8M16 12H18M10 12H14"/>
                    </svg>
                    Galaxy Defenders
                </button>
                <button class="suggestion-chip" data-game="Mario">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 14C8 14 10 16 12 16C14 16 16 14 16 14"/>
                        <circle cx="9" cy="9" r="1.5"/>
                        <circle cx="15" cy="9" r="1.5"/>
                    </svg>
                    Mario
                </button>
                <button class="suggestion-chip" data-game="Zelda">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                    </svg>
                    Zelda
                </button>
                <button class="suggestion-chip" data-game="Cyberpunk">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    Cyberpunk
                </button>
                <button class="suggestion-chip" data-game="FIFA">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 2V22M2 12H22"/>
                        <circle cx="12" cy="12" r="4"/>
                    </svg>
                    FIFA
                </button>
                <button class="suggestion-chip" data-game="GTA">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    GTA
                </button>
            </div>

            <!-- Results -->
            <div class="results-area">
                <!-- Loading -->
                <div id="loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Recherche en cours...</p>
                </div>

                <!-- Results -->
                <div id="results" class="results" style="display: none;">
                    <div class="results-header">
                        <div>
                            <h2>Résultats pour "<span id="searchTerm"></span>"</h2>
                            <span class="count"><span id="resultCount"></span> offres trouvées</span>
                        </div>
                        <button class="sort-btn" onclick="trierPrix()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 7H21M3 12H18M3 17H15"/>
                            </svg>
                            Trier par prix
                        </button>
                    </div>

                    <div id="bestDeal" class="best-deal" style="display: none;"></div>
                    <div class="products-grid" id="productList"></div>
                </div>

                <!-- No Results -->
                <div id="noResults" class="no-results" style="display: none;">
                    <div class="no-results-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21L16.65 16.65"/>
                            <line x1="11" y1="8" x2="11" y2="12"/>
                            <line x1="11" y1="15" x2="11.01" y2="15"/>
                        </svg>
                    </div>
                    <h3>Aucun jeu trouvé</h3>
                    <p>Essayez avec un autre nom</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Error Toast -->
    <div id="error" class="error-toast" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMessage"></span>
        <button onclick="this.parentElement.style.display='none'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
